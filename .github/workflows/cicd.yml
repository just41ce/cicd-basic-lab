name: "CI/CD - cicd-basic-lab to mylab-bastion (Docker)"

on:
  push:
    branches: [main]
  workflow_dispatch:

# Node.js 24 환경 강제 (경고 제거용)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # 모든 run 단계의 기본 경로를 폴더 내부로 설정
    defaults:
      run:
        working-directory: ./cicd-basic-lab
    
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: "Build with Maven"
        run: mvn -B package -DskipTests

      - name: "Clean up JAR filename"
        run: mv ./target/*.jar ./target/app.jar

      - name: "Create Image Tag"
        id: tag
        # 여기서도 폴더 경로를 명시하여 태그 생성
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ vars.DOCKERHUB_USERNAME }}/cicd-basic-lab:${{ github.run_number }}-$SHORT_SHA"
          echo "value=$TAG" >> $GITHUB_OUTPUT

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and Push Image"
        uses: docker/build-push-action@v6
        with:
          # Dockerfile이 들어있는 폴더를 context로 지정 (이게 핵심입니다)
          context: ./cicd-basic-lab
          push: true
          tags: |
            ${{ steps.tag.outputs.value }}
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-basic-lab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: "Print deployment image"
        run: echo "Deploying image ${{ needs.ci.outputs.image_tag }}"

      - name: "Deploy to EC2 via SSH"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            docker pull ${{ needs.ci.outputs.image_tag }}
            docker stop cicd-basic-lab || true
            docker rm cicd-basic-lab || true
            docker run -d \
              --name cicd-basic-lab \
              -p 8080:8080 \
              -e TZ=Asia/Seoul \
              --restart unless-stopped \
              ${{ needs.ci.outputs.image_tag }}
            docker image prune -f
            docker ps
            echo "Deployment Successful"
