# .github/workflows/cicd.yml — 단계 2: Docker Hub + 컨테이너 실행

name: CI/CD - cicd-basic-lab to mylab-bastion (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # 기존에 있던 defaults(working-directory)는 루트 기준 동작을 위해 삭제했습니다.
    
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven 빌드
        run: mvn -B package -DskipTests

      - name: JAR 파일명 정리
        run: mv ./target/*.jar ./target/app.jar

      - name: 이미지 태그 생성
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ vars.DOCKERHUB_USERNAME }}/cicd-basic-lab:${{ github.run_number }}-$SHORT_SHA"
          echo "value=$TAG" >> $GITHUB_OUTPUT

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 Push
        uses: docker/build-push-action@v6
        with:
          # 루트 기준으로 빌드하므로 context를 . 으로 수정
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.value }}
            ${{ vars.DOCKERHUB_USERNAME }}/cicd-basic-lab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: 배포할 이미지 출력
        run: echo "배포 이미지: ${{ needs.ci.outputs.image_tag }}"

      - name: SSH로 EC2에서 docker pull & run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            docker pull ${{ needs.ci.outputs.image_tag }}
            docker stop cicd-basic-lab || true
            docker rm cicd-basic-lab || true
            docker run -d \
              --name cicd-basic-lab \
              -p 8080:8080 \
              -e TZ=Asia/Seoul \
              --restart unless-stopped \
              ${{ needs.ci.outputs.image_tag }}
            docker image prune -f
            docker ps
            echo "배포 완료"
