name: CI/CD - cicd-basic-lab to mylab-bastion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cicd-basic-lab

    outputs:
      artifact_name: ${{ steps.set-name.outputs.value }} # 빈칸 3

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # 빈칸 4

      - name: Maven 빌드
        run: mvn -B package -DskipTests

      - name: JAR 파일명 정리
        run: mv ./target/*.jar ./target/app.jar

      - name: Artifact 이름 설정
        id: set-name
        # 빈칸 5: GITHUB_OUTPUT 설정
        run: echo "value=app-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: JAR Artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-name.outputs.value }}
          # 빈칸 6: 실제 파일 위치 (루트 기준)
          path: cicd-basic-lab/target/app.jar
          retention-days: 1 # 들여쓰기 확인!
