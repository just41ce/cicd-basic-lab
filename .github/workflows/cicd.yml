jobs:
  ci:
    runs-on: ubuntu-latest
    # defaults: # 이 부분은 이제 필요 없으므로 삭제하거나 주석 처리
    #   run:
    #     working-directory: ./cicd-basic-lab

    outputs:
      artifact_name: ${{ steps.set-name.outputs.value }}

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven 빌드
        # 루트에 pom.xml이 있으므로 경로 없이 바로 실행 가능
        run: mvn -B package -DskipTests

      - name: JAR 파일명 정리
        run: mv ./target/*.jar ./target/app.jar

      - name: Artifact 이름 설정
        id: set-name
        run: echo "value=app-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: JAR Artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-name.outputs.value }}
          # 하위 폴더 경로를 지우고 루트 기준인 target/app.jar로 수정
          path: target/app.jar
          retention-days: 1
